[project]
name = "llmbench"
version = "0.1.0"
description = "Benchmark harness for local GGUF models on llama-server"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
bench = "llmbench.cli:main"
bench-report = "llmbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
exclude = [".git", ".venv", "research", "results"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
